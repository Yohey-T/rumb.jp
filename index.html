<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #080808;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(ellipse at 65% 40%, rgba(180,100,60,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 30% 70%, rgba(80,60,150,0.05) 0%, transparent 50%);
      animation: drift 20s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(2%, 1.5%); }
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      max-width: 600px;
      width: 100%;
    }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      color: #fff;
      line-height: 1;
      margin-bottom: 20px;
    }
    .title {
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.45em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 72px;
    }
    .message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #777;
      line-height: 2;
      margin-bottom: 72px;
    }
    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, #333, transparent);
      margin: 0 auto 28px;
    }
    .contact button {
      display: inline-block;
      padding: 11px 36px;
      border: 1px solid #2a2a2a;
      background: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.45em;
      color: #444;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.4s;
    }
    .contact button:hover { border-color: #555; color: #aaa; }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.active { display: flex; }
    .popup {
      background: #111;
      border: 1px solid #222;
      padding: 8px;
      width: 220px;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .popup a, .popup button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: #555;
      text-decoration: none;
      text-align: left;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s;
    }
    .popup a:hover, .popup button:hover { color: #ccc; }
    .popup-divider { height: 1px; background: #1e1e1e; margin: 0 4px; }
    .copy-msg {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: #444;
      text-align: center;
      padding: 6px 0 4px;
      display: none;
    }
    .copy-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="name">Rumb</h1>
    <p class="title">Composer &nbsp;·&nbsp; Arranger &nbsp;·&nbsp; Mix Engineer</p>
    <p class="message">
      "Life isn't about waiting for the storm to pass.<br>
      It's about learning to make music in the rain."
    </p>
    <div class="contact">
      <div class="divider"></div>
      <button onclick="document.querySelector('.overlay').classList.add('active')">Contact</button>
    </div>
  </div>

  <div class="overlay" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="popup">
      <a href="https://mail.google.com/mail/?view=cm&to=yohey@rumb.jp" target="_blank"
         onclick="document.querySelector('.overlay').classList.remove('active')">Gmail</a>
      <div class="popup-divider"></div>
      <a href="mailto:yohey@rumb.jp"
         onclick="document.querySelector('.overlay').classList.remove('active')">メールアプリ</a>
      <div class="popup-divider"></div>
      <button onclick="copyEmail()">Copy Address</button>
      <p class="copy-msg" id="copyMsg">Copied !</p>
    </div>
  </div>

  <script>
    function copyEmail() {
      navigator.clipboard.writeText('yohey@rumb.jp').then(() => {
        const msg = document.getElementById('copyMsg');
        msg.classList.add('show');
        setTimeout(() => {
          msg.classList.remove('show');
          document.querySelector('.overlay').classList.remove('active');
        }, 1200);
      });
    }
  </script>
</body>
</html>
