<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #080808;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(ellipse at 65% 40%, rgba(180,100,60,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 30% 70%, rgba(80,60,150,0.05) 0%, transparent 50%);
      animation: drift 20s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(2%, 1.5%); }
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      max-width: 600px;
      width: 100%;
    }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      color: #fff;
      line-height: 1;
      margin-bottom: 20px;
    }
    .title {
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.45em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 72px;
    }
    .message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #777;
      line-height: 2;
      margin-bottom: 72px;
    }
    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, #333, transparent);
      margin: 0 auto 28px;
    }
    .contact a {
      display: inline-block;
      padding: 11px 36px;
      border: 1px solid #2a2a2a;
      font-size: 0.6rem;
      letter-spacing: 0.45em;
      color: #444;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.4s;
    }
    .contact a:hover { border-color: #555; color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="name">Rumb</h1>
    <p class="title">Composer &nbsp;·&nbsp; Arranger &nbsp;·&nbsp; Mix Engineer</p>
    <p class="message">
      "Life isn't about waiting for the storm to pass.<br>
      It's about learning to make music in the rain."
    </p>
    <div class="contact">
      <div class="divider"></div>
      <a href="mailto:yohey@rumb.jp">Contact</a>
    </div>
  </div>
</body>
</html>
