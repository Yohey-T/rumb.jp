<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 40px 24px;
      max-width: 480px;
      width: 100%;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #333;
      margin: 0 auto 24px;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .bio { color: #aaa; font-size: 0.95rem; line-height: 1.6; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .links a {
      display: block;
      padding: 14px 20px;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .links a:hover { background: #1a1a1a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <!-- プロフィール画像があればここに追加 -->
    </div>
    <h1>Your Name</h1>
    <p class="bio">一言自己紹介をここに書く</p>
    <div class="links">
      <a href="#">Twitter / X</a>
      <a href="#">Instagram</a>
      <a href="#">お問い合わせ</a>
    </div>
  </div>
</body>
</html>
